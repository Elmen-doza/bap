// ---------- drawing helpers
const rnd = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const rect = (c, x, y, w, h) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
const circ = (x, y, r, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); };
function poly(c, ...p) { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) ctx.lineTo(p[i], p[i + 1]); ctx.fill(); }
function sky(a, b) { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, a); g.addColorStop(1, b); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
function stars(n) { for (let i = 0; i < n; i++) { ctx.globalAlpha = .4 + .6 * Math.abs(Math.sin(t / 500 + i)); rect('#fff', rnd(i) * W, rnd(i + 99) * H * .6, 2, 2); } ctx.globalAlpha = 1; }
function snowfall(n) { for (let i = 0; i < n; i++) circ(rnd(i + 7) * W + Math.sin(t / 900 + i) * 20, (rnd(i) * H + t * .04 * (1 + rnd(i + 5))) % H, 1.5 + rnd(i + 3) * 2, '#fff'); }
const EMO = {};
function drawEmo(ch, x, y, s, rot = 0) {
  const k = ch + s;
  if (!EMO[k]) { const c = document.createElement('canvas'); c.width = c.height = Math.ceil(s * 1.4); const x2 = c.getContext('2d');
    x2.font = s + 'px "Apple Color Emoji","Segoe UI Emoji",sans-serif'; x2.textAlign = 'center'; x2.textBaseline = 'middle'; x2.fillText(ch, c.width / 2, c.height / 2 + s * .05); EMO[k] = c; }
  const c = EMO[k]; ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.drawImage(c, -c.width / 2, -c.height / 2); ctx.restore();
}

function bgGreece() {
  sky('#2f7fd6', '#bfe4f5'); circ(680, 110, 50, '#ffe36b');
  rect('#1a5fa8', 0, H - 260, W, 60);
  for (let i = 0; i < 12; i++) rect('rgba(255,255,255,.4)', (i * 90 + t * .03) % W, H - 240 + (i % 3) * 14, 30, 2);
  ctx.fillStyle = '#d9c7a3'; ctx.beginPath(); ctx.moveTo(0, H - 200); ctx.quadraticCurveTo(W / 2, H - 330, W, H - 200); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
  for (let i = 0; i < 7; i++) { const x = 20 + i * 115, y = H - 230 + Math.abs(i - 3) * 14;
    rect('#fff', x, y, 70, 60); rect('#1f5fbf', x + 12, y + 20, 14, 18); rect('#1f5fbf', x + 44, y + 30, 14, 30); }
  const cx = W / 2, cy = H - 300;
  rect('#fff', cx - 70, cy, 140, 110); rect('#fff', cx + 70, cy - 60, 40, 170);
  ctx.fillStyle = '#1f5fbf'; ctx.beginPath(); ctx.arc(cx, cy, 70, Math.PI, 0); ctx.fill();
  rect('#fff', cx - 3, cy - 110, 6, 40); rect('#fff', cx - 14, cy - 98, 28, 6);
  ctx.fillStyle = '#1f5fbf'; ctx.beginPath(); ctx.arc(cx + 90, cy - 60, 20, Math.PI, 0); ctx.fill();
  circ(cx + 90, cy - 25, 9, '#333'); rect('#1f5fbf', cx - 18, cy + 50, 36, 60);
}

  sky('#0b1a3a', '#34507a'); stars(40);
  for (const [x, w, h, c] of [[180, 40, 120, '#c03060'], [620, 40, 130, '#e07a1f'], [280, 50, 180, '#e0b020'], [520, 50, 190, '#2a60c0'], [400, 70, 260, '#2a9d4a']]) {
    rect('#b03030', x - w / 2, H - 200 - h, w, h); for (let k = 0; k < h; k += 24) rect('#e8d8c0', x - w / 2, H - 200 - h + k, w, 5); onion(x, H - 200 - h, w * .75, c); }
  rect('#8a1c1c', 0, H - 200, W, 60); for (let i = 0; i < W / 40; i++) rect('#8a1c1c', i * 40, H - 215, 22, 15);
  rect('#e8eef5', 0, H - 140, W, 140); snowfall(80);

function bgOffice() {
  sky('#c9c4b8', '#a8a397');
  rect('#6fa8d8', 60, 120, W - 120, 260);
  for (let i = 0; i < 10; i++) { const h = 80 + rnd(i) * 150; rect('#3a5a7a', 70 + i * 68, 380 - h, 50, h); }
  for (let i = 0; i < 5; i++) rect('#888', 57 + i * (W - 120) / 4, 120, 6, 260);
  for (let i = 0; i < 4; i++) rect('#fffbe0', 90 + i * 180, 20, 110, 10);

function bgNorthPole() {
  sky('#050b24', '#1a2f5a'); stars(80);
  for (let k = 0; k < 3; k++) { ctx.strokeStyle = `rgba(80,255,160,${.25 - k * .06})`; ctx.lineWidth = 30; ctx.beginPath();
    for (let x = 0; x <= W; x += 20) ctx.lineTo(x, 150 + k * 40 + Math.sin(x / 120 + t / 1500 + k) * 30); ctx.stroke(); }
  rect('#eef4ff', 0, H - 200, W, 200);
  for (let i = 0; i < 8; i++) { const x = 30 + i * 105, h = 100 + rnd(i) * 60; poly('#1f5a3a', x, H - 200 - h, x - 40, H - 190, x + 40, H - 190); }
  rect('#b02020', W / 2 - 80, H - 290, 160, 100); poly('#fff', W / 2 - 95, H - 290, W / 2, H - 350, W / 2 + 95, H - 290); rect('#ffd060', W / 2 - 20, H - 250, 40, 60);
  for (let k = 0; k < 8; k++) rect(k % 2 ? '#fff' : '#d02020', W - 120, H - 340 + k * 18, 12, 18); circ(W - 114, H - 345, 12, '#d4af37');

function bgApocalypse() {

  for (let i = 0; i < 6; i++) { const p = (t / 1500 + rnd(i)) % 1, x = rnd(i + 3) * W + p * 200, y = p * H;
    ctx.strokeStyle = 'rgba(255,150,40,.6)'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 60, y - 90); ctx.stroke(); circ(x, y, 9, '#ffd060'); }
  for (let i = 0; i < 9; i++) rect('#120606', i * 92, H - 200 - rnd(i) * 220, 70, 400);
  for (let i = 0; i < 40; i++) circ(i * 21, H - Math.abs(Math.sin(t / 150 + i)) * 40, 20, `hsl(${20 + rnd(i) * 30},100%,50%)`);

// ---------- levels
const LEVELS = [
  { name: 'BAP TISM', tag: 'Religion has come for you.', bg: bgGreece, priests: true, shot: 'ostia', boss: { name: 'THE POPE', pope: true } },
  { name: 'BAB OON', tag: 'Go bananas.', bg: bgJungle, enemies: ['🐒', '🐵', '🦧'], shot: '🍌', boss: { name: 'KING BABOON', e: '🦍', hat: '👑' } },
  { name: 'BAP RIKA', tag: 'Things are getting spicy.', bg: bgDesert, enemies: ['🌶️', '🫑', '🧄', '🧅'], shot: '🔥', boss: { name: 'EL CHILI SUPREMO', e: '🌶️', hat: '👑' } },
  { name: 'BAP ARAZZI', tag: 'Smile for the cameras.', bg: bgRedCarpet, enemies: ['📸', '🎥', '🤳'], shot: '⚡', boss: { name: 'THE TABLOID', e: '📹' } },
  { name: 'BAP YRUS', tag: 'Walk like an Egyptian.', bg: bgEgypt, enemies: ['🐍', '🦂', '🐫', '🪲'], shot: '📜', boss: { name: 'THE SCORPION KING', e: '🦂', hat: '👑' } },
  { name: 'BAB USHKA', tag: 'Grandma is not happy.', bg: bgMoscow, enemies: ['👵'], shot: '🪆', boss: { name: 'MEGA MATRYOSHKA', e: '🪆' } },
  { name: 'BAP ERWORK', tag: 'Fill in the forms. In triplicate.', bg: bgOffice, enemies: ['🧑‍💼', '👩‍💼', '👨‍💼'], shot: '📎', boss: { name: 'HACIENDA', e: '🧑‍⚖️' } },
  { name: 'BAB YLON', tag: 'By the rivers of Babylon...', bg: bgBabylon, enemies: ['💂', '🦁', '🐂'], shot: '🗡️', boss: { name: 'NEBUCHADNEZZAR', e: '🤴' } },
  { name: 'BAP ANOEL', tag: 'Ho ho no.', bg: bgNorthPole, enemies: ['🧝', '☃️', '🦌'], shot: '🎁', boss: { name: 'PAPÁ NOEL', e: '🎅' } },
  { name: 'BAP OCALYPSE', tag: 'Every boss. No mercy.', bg: bgApocalypse, rush: true },
];

let state = 'title', keys = {}, t = 0, level = 0;
let player, bullets, enemies, drops, ostias, particles, boss, wave, kills, score, lives, weaponLvl, lastShot, faceSwapUntil, msg, msgUntil = 0;

function newGame() { level = 0; lives = 5; score = 0; kills = 0; weaponLvl = 0; }
function startLevel() {
  player = { x: W / 2, y: H - 110, r: 42, inv: 0 };
  bullets = []; enemies = []; drops = []; ostias = []; particles = [];
  boss = null; wave = 0; lastShot = 0; faceSwapUntil = 0;
  nextWave();
}
function banner(text, ms = 2000) { msg = text; msgUntil = performance.now() + ms; }

function spawnBoss(li) {
  const L = LEVELS[level];
  const hp = L.rush ? 180 + li * 60 : 250 + li * 200;
  boss = { li, x: W / 2, y: -150, hp, max: hp, dir: 1, lastAtk: 0, lastDrop: performance.now() - 3000, flash: 0, ...LEVELS[li].boss };
  banner(boss.name + (L.rush ? '' : ' HAS ARRIVED'), 2200);
}

function nextWave() {
  wave++;
  const L = LEVELS[level];
  if (L.rush) { spawnBoss(0); return; }
  if (wave === 3) { spawnBoss(level); return; }
  const rows = 2 + wave, cols = 8;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    enemies.push({ bx: 90 + c * 88, by: 80 + r * 72, x: 90 + c * 88, y: -200 - r * 60, hp: 1 + level * 1.3 + (wave - 1) * .5, ph: Math.random() * 6,
      type: L.priests && PRIESTS[(r + c) % PRIESTS.length], em: L.enemies && L.enemies[(r + c) % L.enemies.length] });
  if (wave > 1) banner('WAVE ' + wave);
}

// ---------- sprites
function drawFace(x, y, r) {
  const w = performance.now() < faceSwapUntil;
  const img = w ? FACE2 : FACE, k = img.naturalWidth / (w ? 536 : 1042), [sx, sy, sw, sh] = (w ? CROP.w : CROP.n).map(v => v * k);
  if (!img.complete) return;
  ctx.save(); ctx.beginPath(); ctx.ellipse(x, y, r, r * 1.15, 0, 0, 7); ctx.clip();
  ctx.drawImage(img, sx, sy, sw, sh, x - r, y - r * 1.15, r * 2, r * 2.3);
  ctx.restore();
}

function drawPriest(e) {
  const { x, y } = e, p = e.type;
  poly(p.robe, x - 22, y + 30, x + 22, y + 30, x + 13, y - 2, x - 13, y - 2);
  rect(p.trim, x - 2, y + 2, 4, 26);
  if (p.hat === 'collar') rect('#fff', x - 5, y - 3, 10, 5);
  circ(x, y - 14, 13, '#f1c9a5');
  rect('#000', x - 6, y - 17, 3, 3); rect('#000', x + 3, y - 17, 3, 3); rect('#000', x - 4, y - 8, 8, 2);
  if (p.hat === 'orthodox') { rect('#111', x - 13, y - 36, 26, 16); ctx.fillStyle = '#555'; ctx.beginPath(); ctx.arc(x, y - 4, 11, 0, Math.PI); ctx.fill(); }
  if (p.hat === 'kippah') { ctx.fillStyle = '#3060c0'; ctx.beginPath(); ctx.arc(x, y - 22, 8, Math.PI, 0); ctx.fill(); rect('#444', x - 12, y - 14, 3, 12); rect('#444', x + 9, y - 14, 3, 12); }
  if (p.hat === 'mitre') { poly('#fff', x - 11, y - 22, x, y - 46, x + 11, y - 22); rect(p.trim, x - 1, y - 40, 2, 16); }
  const f = Math.sin(t / 120 + e.ph) * 8;
  ctx.strokeStyle = p.robe; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(x - 12, y + 4); ctx.lineTo(x - 28, y - 4 + f); ctx.moveTo(x + 12, y + 4); ctx.lineTo(x + 28, y - 4 + f); ctx.stroke();
}
function drawEnemy(e) { if (e.type) drawPriest(e); else drawEmo(e.em, e.x, e.y, 46, Math.sin(t / 200 + e.ph) * .25); }

function drawPope(x, y) {
  poly('#fff', x - 90, y + 110, x + 90, y + 110, x + 45, y, x - 45, y);
  rect('#d4af37', x - 6, y + 10, 12, 95); rect('#d4af37', x - 25, y + 35, 50, 10);
  circ(x, y - 28, 38, '#f1c9a5');
  rect('#000', x - 16, y - 36, 7, 7); rect('#000', x + 9, y - 36, 7, 7); rect('#a33', x - 12, y - 12, 24, 4);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x - 32, y - 55); ctx.quadraticCurveTo(x, y - 150, x + 32, y - 55); ctx.fill();
  rect('#d4af37', x - 32, y - 62, 64, 7); rect('#d4af37', x - 3, y - 125, 6, 60);
  rect('#d4af37', x + 100, y - 90, 6, 200); rect('#d4af37', x + 88, y - 80, 30, 6);
}
function drawBoss(b) {
  ctx.save(); if (b.flash) ctx.filter = 'brightness(1.8)';
  if (b.pope) drawPope(b.x, b.y);
  else { drawEmo(b.e, b.x, b.y, 190, Math.sin(t / 400) * .1); if (b.hat) drawEmo(b.hat, b.x, b.y - 110, 80); }
  ctx.restore();
  rect('#400', 100, 20, W - 200, 16); rect('#e33', 100, 20, (W - 200) * Math.max(0, b.hp) / b.max, 16);
  ctx.fillStyle = '#fff'; ctx.font = '14px Impact'; ctx.textAlign = 'center'; ctx.fillText(b.name, W / 2, 33);
}

function drawBullet(b) {
  ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI / 2);
  const w = WEAPONS[b.lvl];
  if (w.snow) { ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 12; ctx.beginPath(); ctx.arc(0, 0, 7, 0, 7); ctx.fill(); }
  else if (!w.col) { // cigarette: white paper, orange filter, glowing tip + smoke
    rect('#f5f5f5', -4, -14, 8, 26); rect('#d98a3a', -4, 10, 8, 10); rect('#555', -4, -18, 8, 4);
    ctx.shadowColor = '#f60'; ctx.shadowBlur = 10; rect('#ff5010', -4, -20, 8, 3);
    ctx.shadowBlur = 0; circ(Math.sin(t / 80) * 3, -26, 4, 'rgba(200,200,200,.5)'); }
  else { rect(w.col, -5, -4, 10, 14); rect(w.col, -2, -12, 4, 9); rect('rgba(255,255,255,.5)', -3, -2, 2, 10); }
  ctx.restore();
}

function drawShot(o) {
  if (o.kind !== 'ostia') return drawEmo(o.kind, o.x, o.y, Math.round(o.r * 2.4), t / 200 + o.x);
  ctx.fillStyle = '#fffbe8'; ctx.strokeStyle = '#d8cfa8'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, 7); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#e6dcb4'; ctx.beginPath(); ctx.moveTo(o.x - 4, o.y); ctx.lineTo(o.x + 4, o.y); ctx.moveTo(o.x, o.y - 5); ctx.lineTo(o.x, o.y + 5); ctx.stroke();
}

// ---------- game logic
function shoot(now) {
  const w = WEAPONS[weaponLvl];
  if (now - lastShot < w.rate) return; lastShot = now;
  for (let i = 0; i < w.shots; i++) {
    const a = -Math.PI / 2 + (w.shots > 1 ? (i / (w.shots - 1) - .5) * 2 * w.spread : 0);
    bullets.push({ x: player.x, y: player.y - 40, vx: Math.cos(a) * 11, vy: Math.sin(a) * 11, dmg: w.dmg, lvl: weaponLvl });
  }
}

function boom(x, y, col, n = 12) { for (let i = 0; i < n; i++) particles.push({ x, y, vx: (Math.random() - .5) * 8, vy: (Math.random() - .5) * 8, life: 30, col }); }

function hitPlayer() {
  if (player.inv > 0) return;
  lives--; player.inv = 120; boom(player.x, player.y, '#f44', 25);
  weaponLvl = 0; banner('BACK TO CIGARETTES', 1200);
  if (lives <= 0) state = 'over';
}

function killEnemy(e) {
  kills++; score += 100; boom(e.x, e.y, e.type ? e.type.robe : '#fc3');
  if (kills % 10 === 0) { faceSwapUntil = performance.now() + 5000; banner('BAP MODE', 1200); }
  dropFrom(e.x, e.y);
}

const DROPS = { up: '🍾', bad: '🥛', bad2: '🧃', life: '❤️' };
function dropFrom(x, y) {
  const r = Math.random();
  if (r < .012) drops.push({ x, y, vy: 5.5, kind: 'life' });                  // rare and falls fast
  else if (r < .012 + .06 + level * .02) drops.push({ x, y, vy: 2.5, kind: Math.random() < .5 ? 'bad' : 'bad2' });
  else if (r < .3 + .012 - level * .02) drops.push({ x, y, vy: 2, kind: 'up' }); // upgrades get rarer each level
}

function bossAttack(b, now) {
  const L = LEVELS[level], every = L.rush ? 1100 : 1400 - level * 80;
  if (now - b.lastAtk < every) return; b.lastAtk = now;
  const kind = LEVELS[b.li].shot, s = (x, y, vx, vy) => ostias.push({ x, y, vx, vy, r: 16, kind });
  if (b.li % 3 === 0) for (let i = -2; i <= 2; i++) s(b.x, b.y + 80, i * 1.3, 3);
  else if (b.li % 3 === 1) { const a = Math.atan2(player.y - b.y, player.x - b.x); for (let i = -1; i <= 1; i++) s(b.x, b.y + 60, Math.cos(a + i * .2) * 3.5, Math.sin(a + i * .2) * 3.5); }
  else for (let i = 0; i < 6; i++) s(b.x - 150 + i * 60, b.y + 60, 0, 2.6);
}

function bossDefeated() {
  const L = LEVELS[level];
  boom(boss.x, boss.y, '#fff', 80); score += 5000; drops.push({ x: boss.x, y: boss.y, vy: 2, kind: 'up' });
  if (L.rush && boss.li < LEVELS.length - 2) { spawnBoss(boss.li + 1); return; }
  boss = null; ostias = [];
  if (L.rush) state = 'win'; else { state = 'clear'; lives = Math.min(lives + 1, 9); }
}

function update(now) {
  const sp = 7;
  if (keys.ArrowLeft || keys.a) player.x -= sp; if (keys.ArrowRight || keys.d) player.x += sp;
  if (keys.ArrowUp || keys.w) player.y -= sp; if (keys.ArrowDown || keys.s) player.y += sp;
  player.x = Math.max(40, Math.min(W - 40, player.x)); player.y = Math.max(H / 2, Math.min(H - 50, player.y));
  if (player.inv > 0) player.inv--;
  if (keys[' ']) shoot(now);

  bullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
  bullets = bullets.filter(b => b.y > -20 && b.x > -20 && b.x < W + 20 && !b.dead);

  const L = LEVELS[level];
  enemies.forEach(e => {
    const tx = e.bx + Math.sin(now / 900 + wave) * 40, ty = e.by + Math.sin(now / 600 + e.ph) * 6;
    e.x += (tx - e.x) * .05; e.y += (ty - e.y) * .05;
    if (Math.random() < .0004 + level * .0004 + (wave - 1) * .0003) ostias.push({ x: e.x, y: e.y + 30, vx: 0, vy: 2 + level * .25 + Math.random() * 1.5, r: 10, kind: L.shot });
    for (const b of bullets) if (!b.dead && Math.abs(b.x - e.x) < 24 && Math.abs(b.y - e.y) < 32) { b.dead = true; e.hp -= b.dmg; if (e.hp <= 0) { e.dead = true; killEnemy(e); break; } }
  });
  enemies = enemies.filter(e => !e.dead);

  if (boss) {
    boss.y += (170 - boss.y) * .02; boss.x += boss.dir * 2.5;
    if (boss.x < 140 || boss.x > W - 140) boss.dir *= -1;
    bossAttack(boss, now);
    if (now - boss.lastDrop > 6000) { boss.lastDrop = now; drops.push({ x: boss.x + (Math.random() - .5) * 200, y: boss.y + 80, vy: 2, kind: 'up' }); }
    if (boss.flash > 0) boss.flash--;
    for (const b of bullets) if (!b.dead && Math.abs(b.x - boss.x) < 80 && Math.abs(b.y - boss.y) < 110) { b.dead = true; boss.hp -= b.dmg; boss.flash = 3; boom(b.x, b.y, '#d4af37', 3); }
    if (boss.hp <= 0) bossDefeated();
  }

  ostias.forEach(o => { o.y += o.vy; o.x += o.vx; if (Math.hypot(o.x - player.x, o.y - player.y) < o.r + player.r * .8) { o.dead = true; hitPlayer(); } });
  ostias = ostias.filter(o => o.y < H + 20 && o.y > -50 && !o.dead);

  drops.forEach(d => { d.y += d.vy; if (Math.hypot(d.x - player.x, d.y - player.y) < 50) { d.dead = true;
    if (d.kind === 'life') { lives = Math.min(lives + 1, 9); banner('EXTRA LIFE!', 1200); }
    else if (d.kind === 'up') { if (weaponLvl < WEAPONS.length - 1) weaponLvl++; banner(WEAPONS[weaponLvl].name.toUpperCase() + '!', 1200); }
    else { if (weaponLvl > 0) weaponLvl--; banner('YUCK! ' + WEAPONS[weaponLvl].name.toUpperCase(), 1200); } } });
  drops = drops.filter(d => d.y < H && !d.dead);

  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  particles = particles.filter(p => p.life > 0);

  if (!enemies.length && !boss && state === 'play') nextWave();
}

const line = (s, x, y) => { ctx.strokeText(s, x, y); ctx.fillText(s, x, y); };
function drawHUD(now) {
  ctx.textAlign = 'left'; ctx.font = '22px Impact'; ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
  line('LVL ' + (level + 1) + ' · ' + LEVELS[level].name, 14, 64);
  line('SCORE ' + score, 14, H - 16); line('LIVES ' + '♥'.repeat(Math.max(0, lives)), 200, H - 16);
  line('WEAPON: ' + WEAPONS[weaponLvl].name, 400, H - 16); line('KILLS ' + kills, 670, H - 16);
  if (now < msgUntil) { ctx.textAlign = 'center'; ctx.font = '54px Impact'; ctx.lineWidth = 6; line(msg, W / 2, H / 2 - 40); }
}

const BTN = { x: W / 2 - 140, y: 560, w: 280, h: 80 };
function drawTitle(now) {
  bgGreece();
  rect('rgba(0,0,0,.45)', 0, 0, W, H);
  drawFace(W / 2, 360 + Math.sin(now / 400) * 10, 110);
  ctx.textAlign = 'center'; ctx.lineWidth = 10; ctx.strokeStyle = '#1f5fbf'; ctx.fillStyle = '#fff';
  ctx.font = '150px Impact'; line('BAP TIME', W / 2, 190);
  const pulse = 1 + Math.sin(now / 250) * .04;
  ctx.save(); ctx.translate(W / 2, BTN.y + BTN.h / 2); ctx.scale(pulse, pulse);
  rect('#1f5fbf', -BTN.w / 2, -BTN.h / 2, BTN.w, BTN.h);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.strokeRect(-BTN.w / 2, -BTN.h / 2, BTN.w, BTN.h);
  ctx.fillStyle = '#fff'; ctx.font = '46px Impact'; ctx.fillText('PLAY NOW', 0, 16); ctx.restore();
}

function drawIntro(now) {
  const L = LEVELS[level];
  L.bg(); rect('rgba(0,0,0,.6)', 0, 0, W, H);
  ctx.textAlign = 'center'; ctx.fillStyle = '#ffe36b'; ctx.font = '40px Impact'; ctx.fillText('LEVEL ' + (level + 1), W / 2, 320);
  ctx.fillStyle = '#fff'; ctx.font = '100px Impact'; ctx.fillText(L.name, W / 2, 420);
  ctx.font = 'italic 28px Georgia'; ctx.fillText(L.tag, W / 2, 470);
  ctx.font = '22px Impact'; ctx.fillStyle = '#ddd';
  ctx.fillText('Arrows / WASD to move  ·  SPACE to shoot  ·  catch 🍾 · avoid 🥛🧃 · ❤️ = life · M = mute', W / 2, 540);
  if (Math.floor(now / 500) % 2) { ctx.font = '40px Impact'; ctx.fillStyle = '#ffe36b'; ctx.fillText('PRESS ENTER', W / 2, 650); }
}

function drawOverlay(title, sub) {
  rect('rgba(0,0,0,.6)', 0, 0, W, H); ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = '64px Impact'; ctx.fillText(title, W / 2, H / 2 - 20);
  ctx.font = '28px Impact'; ctx.fillText(sub, W / 2, H / 2 + 40);
}

function frame(now) {
  t = now;
  if (state === 'title') drawTitle(now);
  else if (state === 'intro') drawIntro(now);
  else {
    if (state === 'play') update(now);
    LEVELS[level].bg(); rect('rgba(0,0,0,.12)', 0, 0, W, H);
    enemies.forEach(drawEnemy); if (boss) drawBoss(boss);
    drops.forEach(d => drawEmo(DROPS[d.kind], d.x, d.y, 34, Math.sin(t / 150) * .3));
    ostias.forEach(drawShot); bullets.forEach(drawBullet);
    particles.forEach(p => rect(p.col, p.x, p.y, 4, 4));
    if (player.inv % 10 < 6) drawFace(player.x, player.y, player.r);
    drawHUD(now);
    if (state === 'clear') drawOverlay(LEVELS[level].name + ' COMPLETE', '+1 life  ·  ENTER for next level');
    if (state === 'over') drawOverlay(level === 0 ? 'EXCOMMUNICATED' : 'GAME OVER', 'ENTER to retry ' + LEVELS[level].name);
    if (state === 'win') drawOverlay('YOU SURVIVED THE BAPOCALYPSE', 'Score ' + score + '  ·  ENTER for title');
  }
  drawEmo(muted ? '🔇' : '🔊', MUTE.x + MUTE.s / 2, MUTE.y + MUTE.s / 2, 30);
  requestAnimationFrame(frame);
}

// ---------- music: French musette waltz (3/4 oom-pa-pa, detuned "accordion" lead) in a Greek hijaz scale, chiptune style
let AC, master, muted = false, nextNote = 0, step = 0;
try { muted = localStorage.getItem('bapMuted') === '1'; } catch (e) {}
const MEL = [7,null,5,4,5,7, 8,7,5,4,1,0, 5,null,8,null,12,10, 8,7,8,10,8,7,
             10,null,8,7,8,10, 12,10,8,7,5,4, 1,4,5,7,8,7, 4,1,0,null,0,null]; // semitones from D4, eighth notes
const ROOT = [0,0,5,5,-2,-2,0,0], CHORD = { 0: [0,4,7], 5: [5,8,12], '-2': [-2,1,5] }; // D, Gm, Cm
const hz = n => 293.66 * Math.pow(2, n / 12);
function tone(f, at, dur, type, vol, detune = 0) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.value = f; o.detune.value = detune;
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(.001, at + dur);
  o.connect(g).connect(master); o.start(at); o.stop(at + dur + .02);
}
function hat(at) {
  const b = AC.createBuffer(1, 2000, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const src = AC.createBufferSource(), g = AC.createGain(); g.gain.value = .04; src.buffer = b; src.connect(g).connect(master); src.start(at);
}
function schedule() {
  const bpm = state === 'play' ? 150 + level * 8 + (boss ? 20 : 0) : 130; // speeds up like a sirtaki
  const e = 30 / bpm; // eighth note length
  while (nextNote < AC.currentTime + .15) {
    const bar = Math.floor(step / 6) % 8, pos = step % 6, m = MEL[step % MEL.length], r = ROOT[bar];
    if (m !== null) { tone(hz(m), nextNote, e * 1.6, 'square', .05, -8); tone(hz(m), nextNote, e * 1.6, 'square', .05, 8); } // musette tremolo
    if (pos === 0) tone(hz(r - 24), nextNote, e * 1.8, 'triangle', .25);                  // oom
    if (pos === 2 || pos === 4) CHORD[r].forEach(c => tone(hz(c - 12), nextNote, e * .8, 'square', .025)); // pa pa
    if (pos % 2 === 1) hat(nextNote);
    nextNote += e; step++;
  }
}
function startMusic() {
  if (AC) return AC.resume();
  AC = new (window.AudioContext || window.webkitAudioContext)();
  master = AC.createGain(); master.gain.value = muted ? 0 : .6; master.connect(AC.destination);
  nextNote = AC.currentTime + .05; setInterval(schedule, 25);
}
function toggleMute() {
  muted = !muted; if (master) master.gain.value = muted ? 0 : .6;
  try { localStorage.setItem('bapMuted', muted ? '1' : '0'); } catch (e) {}
}
const MUTE = { x: W - 56, y: 8, s: 44 };

function advance() {
  if (state === 'title') { newGame(); state = 'intro'; }
  else if (state === 'intro') { startLevel(); state = 'play'; }
  else if (state === 'clear') { level++; state = 'intro'; }
  else if (state === 'over') { lives = 5; state = 'intro'; }
  else if (state === 'win') state = 'title';
}
addEventListener('keydown', e => {
  keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = true;
  startMusic();
  if (e.key === 'm' || e.key === 'M') toggleMute();
  if (e.key === ' ' || e.key.startsWith('Arrow')) e.preventDefault();
  if (e.key === 'Enter') advance();
  if (state === 'intro' && /^[0-9]$/.test(e.key)) level = (+e.key + 9) % 10; // level select: 1-9, 0 = level 10
});
addEventListener('keyup', e => { keys[e.key.length === 1 ? e.key.toLowerCase() : e.key] = false; });
cv.addEventListener('click', e => {
  startMusic();
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  if (x > MUTE.x && y < MUTE.y + MUTE.s) return toggleMute();
  if (state !== 'title') return;
  if (x > BTN.x && x < BTN.x + BTN.w && y > BTN.y && y < BTN.y + BTN.h) advance();
});
requestAnimationFrame(frame);
